<style>
:root {
  --bg: #f3f6f4; --card: #ffffff; --ink: #14201b; --muted: #5a6a62; --line: #d8e2dc;
  --brand: #0c7a52; --brand-ink: #ffffff; --brand-soft: #e4f3ec; --accent: #f2c230;
  --danger: #b3261e; --danger-soft: #fbe9e7; --live: #c2410c;
  --floor: #e8eee9; --wall: #33443c; --free-bg: #f1f5f2; --free-line: #a9bbb0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1613; --card: #17211d; --ink: #e9f1ed; --muted: #94a69d; --line: #2a3832;
    --brand: #34c48e; --brand-ink: #062419; --brand-soft: #12342a;
    --danger: #ff8a80; --danger-soft: #3a1c19; --live: #ffb067;
    --floor: #16201c; --wall: #6f877c; --free-bg: #1b2722; --free-line: #4a5e54;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 880px; margin: 0 auto; padding: 16px 16px 48px; }
[hidden] { display: none !important; }

.hero { position: relative; overflow: hidden; border-radius: 18px; padding: 22px 20px 20px; background: linear-gradient(160deg, #0a5e40, #0c7a52 70%); color: #fff; }
.hero .herocourt { position: absolute; right: -14px; top: -6px; width: 190px; color: #fff; opacity: .16; }
.eyebrow { position: relative; margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { position: relative; margin: 0 0 8px; font-size: 26px; line-height: 1.15; }
.hero p { position: relative; margin: 0; font-size: 15px; opacity: .92; }
.hero .when { margin-top: 12px; font-weight: 700; font-size: 16px; opacity: 1; }
.hero .venue { margin-top: 2px; }

.panel { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 16px 14px; }
label.lbl { display: block; margin: 0 0 6px; font-size: 14px; font-weight: 600; }
select { width: 100%; height: 48px; padding: 0 14px; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; }
select:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--brand); }
.mine { margin: 10px 0 0; padding: 11px 13px; border-radius: 12px; background: var(--brand-soft); font-size: 15px; font-weight: 600; }
.mine small { display: block; margin-top: 2px; font-size: 13px; font-weight: 500; color: var(--muted); }
.note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.note a { color: var(--brand); font-weight: 600; }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
.tab { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.tab[aria-pressed=true] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tab .now { margin-left: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--live); }
.tab[aria-pressed=true] .now { color: var(--brand-ink); }

.sub { margin: 14px 0 0; font-size: 14px; color: var(--muted); }

/* ── the hall ──────────────────────────────────────────────────────────────────────────────────
   As GP Sports drew it: walk in through the door — the LEFT side has 4 courts, the RIGHT side 8; the courts run away from the door
   in pairs (odd number at the far end, even number nearest the door). Two drawings of the same hall:
   narrow screens → turned on its side (door on the left, courts wide enough to read a company name); wide screens → as you walk in (door at the bottom). */
.hall { position: relative; display: grid; gap: 8px; margin-top: 12px; padding: 12px 12px 14px 8px; background: var(--floor); border: 3px solid var(--wall); border-radius: 18px; grid-template-columns: 36px minmax(0, 1fr) minmax(0, 1fr); }
.side { margin: 0; align-self: end; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sl { grid-column: 2 / 4; grid-row: 1; }
.sr { grid-column: 2 / 4; grid-row: 4; padding-top: 4px; }
.door { grid-column: 1; grid-row: 3 / 6; align-self: center; justify-self: stretch; margin-left: -6px; padding: 9px 2px 8px; border-radius: 8px; background: var(--wall); color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-align: center; text-transform: uppercase; }
.door::after { content: "▶"; display: block; margin-top: 2px; font-size: 12px; letter-spacing: 0; }

.court { position: relative; display: flex; align-items: center; justify-content: center; padding: 0 8px 0 30px; grid-column: var(--nc); grid-row: var(--nr); aspect-ratio: 134 / 61; border-radius: 8px; overflow: hidden; color: rgba(255, 255, 255, .88); background: linear-gradient(160deg, #1b9c6d, #0c7a52); box-shadow: 0 6px 14px -9px rgba(6, 50, 33, .7); }
.court.free { color: var(--free-line); background: var(--free-bg); box-shadow: none; outline: 1.5px dashed var(--free-line); outline-offset: -1.5px; }
.court.mine { z-index: 2; color: rgba(110, 76, 0, .6); background: linear-gradient(160deg, #ffe073, #f2c230); box-shadow: 0 0 0 3px var(--card), 0 0 0 6px var(--accent), 0 10px 22px -8px rgba(160, 110, 0, .8); }
.hall.picked .court:not(.mine) { opacity: .42; }
.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.lines .ln { fill: none; stroke: currentColor; stroke-width: 1.3; vector-effect: non-scaling-stroke; }
.lines .net { fill: none; stroke: currentColor; stroke-width: 3.2; vector-effect: non-scaling-stroke; opacity: .85; }
.lines.v { display: none; }
.no { position: absolute; top: 5px; left: 5px; z-index: 1; min-width: 22px; height: 22px; padding: 0 5px; display: grid; place-items: center; border-radius: 999px; background: #fff; color: #0a5e40; font-size: 12px; font-weight: 800; line-height: 1; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.court.free .no { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--free-line); }
.court.mine .no { background: #3d2b00; color: #ffe073; }
.co { position: relative; z-index: 1; max-width: 100%; padding: 4px 5px; border-radius: 8px; background: rgba(5, 38, 26, .82); color: #fff; font-size: 11.5px; font-weight: 700; line-height: 1.2; text-align: center; overflow-wrap: break-word; }
.court.free .co { background: transparent; color: var(--muted); font-weight: 600; }
.court.mine .co { background: #fff; color: #3d2b00; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 12px 2px 0; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 20px; height: 12px; border-radius: 3px; }
.legend .b { background: linear-gradient(160deg, #1b9c6d, #0c7a52); }
.legend .f { background: var(--free-bg); outline: 1.5px dashed var(--free-line); outline-offset: -1.5px; }
.legend .m { background: var(--accent); }
.turn { margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
.away { margin: 10px 0 0; padding: 10px 13px; border-radius: 12px; background: var(--brand-soft); font-size: 14px; font-weight: 600; }

@media (max-width: 349px) {   /* the smallest phones: a little less type so a two-line name still fits inside its court */
  .court { padding: 0 4px 0 29px; }
  .co { padding: 3px 4px; font-size: 10.5px; }
  .no { top: 3px; left: 3px; min-width: 20px; height: 20px; padding: 0 3px; font-size: 11px; }
}
@media (min-width: 700px) {
  .hall { gap: 12px; padding: 14px 16px 34px; grid-template-columns: repeat(2, minmax(0, 1fr)) minmax(44px, .7fr) repeat(4, minmax(0, 1fr)); }
  .sl { grid-column: 1 / 3; grid-row: 1; }
  .sr { grid-column: 4 / 8; grid-row: 1; padding-top: 0; }
  .door { grid-column: 3; grid-row: 4; align-self: start; justify-self: center; margin: 0; transform: translateY(26px); padding: 6px 16px; font-size: 11px; white-space: nowrap; }
  .door::after { content: " ▲"; display: inline; margin: 0; font-size: inherit; }
  .court { grid-column: var(--wc); grid-row: var(--wr); aspect-ratio: 61 / 134; }
  .lines.h { display: none; }
  .lines.v { display: block; }
  .court { padding: 0 4px; }
  .co { font-size: clamp(10.5px, 1.5vw, 13.5px); }
  .turn { display: none; }
}

.tablewrap { margin-top: 12px; overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
th { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
td.cno { font-weight: 800; color: var(--muted); white-space: nowrap; }
td.free { color: var(--muted); }
th.live, td.live { background: rgba(242, 194, 48, .2); }
td.mine-cell { background: var(--brand-soft); font-weight: 700; box-shadow: 0 0 0 2px var(--brand) inset; }
tr:last-child td { border-bottom: 0; }

.foot { margin: 18px 2px 0; font-size: 13px; color: var(--muted); }
.foot a { color: var(--brand); font-weight: 600; }
.banner { margin: 14px 0 0; padding: 10px 13px; border-radius: 12px; background: var(--danger-soft); color: var(--danger); font-size: 14px; font-weight: 600; }
.err { margin-top: 16px; padding: 16px; border-radius: 14px; background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.err button { margin-top: 10px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 700; cursor: pointer; }
@media print { .tabs, #find, .foot { display: none; } .hero { background: none; color: #000; } .court { box-shadow: none; } }
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <svg class="herocourt" viewBox="0 0 120 60" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="114" height="54"/><line x1="60" y1="3" x2="60" y2="57"/><line x1="3" y1="12" x2="117" y2="12"/><line x1="3" y1="48" x2="117" y2="48"/><line x1="24" y1="3" x2="24" y2="57"/><line x1="96" y1="3" x2="96" y2="57"/><line x1="24" y1="30" x2="96" y2="30"/></g></svg>
    <p class="eyebrow" id="event"></p>
    <h1>Court testing floor plan</h1>
    <p>Which company is on which court, and when.</p>
    <p class="when" id="when" hidden></p>
    <p class="venue" id="venue" hidden></p>
  </header>

  <section class="panel" id="find" hidden>
    <label class="lbl" for="company">Find your company</label>
    <select id="company"></select>
    <p class="mine" id="mine" hidden></p>
    <p class="note">Not in the list? Your company hasn’t booked a court-testing slot yet — <a href="index.html">book one here</a>.</p>
  </section>

  <p class="banner" id="banner" role="status" hidden></p>
  <div class="tabs" id="tabs" role="group" aria-label="Choose a session" hidden></div>
  <p class="sub" id="sub" hidden></p>
  <div id="view" aria-live="polite"><p class="sub">Loading the floor plan…</p></div>
  <p class="foot" id="foot" hidden></p>
</main>
<noscript><p style="padding:20px">This page needs JavaScript. Please turn it on, or ask the GP Sports team.</p></noscript>
<script>
/* Standalone page: reads the live floor plan from the same server, over a cookie-less fetch(). */
var API_URL = "https://script.google.com/macros/s/AKfycbyg9-oAuzi4kcfH9AHfHt8Td7_75Ey7KCf8wOisxR8ONMaRf6l-bZYQmrpKd6UIOER1Lw/exec";
var EVENT_DATE = "2026-10-01";
/* PURE:START — no page access in here, so tests can run it on its own */
function startHour(key) { var m = /^(\d+)-(\d+)(am|pm)$/.exec(key); if (!m) return null; var h = +m[1]; if (m[3] === 'pm' && h < 12) h += 12; return h; }
function label(key) { var m = /^(\d+)-(\d+)(am|pm)$/.exec(key); return m ? m[1] + '–' + m[2] + ' ' + m[3] : key; }
/* Penang's clock: { date: '2026-10-01', hour: 19 } for any moment, wherever the phone is. */
function penang(d) {
  var p = {}; new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kuala_Lumpur', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hour12: false }).formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
  return { date: p.year + '-' + p.month + '-' + p.day, hour: +p.hour % 24 };
}
/* The session in progress on the event day ('' on any other day, or between sessions). */
function liveKey(keys, eventDate, now) {
  if (!eventDate || now.date !== eventDate) return '';
  for (var i = 0; i < keys.length; i++) { var h = startHour(keys[i]); if (h != null && now.hour >= h && now.hour < h + 1) return keys[i]; }
  return '';
}
/* Which tab to open first: the session in progress, else the next one, else the last; the whole evening on any other day. */
function firstTab(keys, eventDate, now) {
  if (!eventDate || now.date !== eventDate) return 'all';
  var pick = keys[keys.length - 1];
  for (var i = 0; i < keys.length; i++) { var h = startHour(keys[i]); if (h != null && now.hour < h + 1) { pick = keys[i]; break; } }
  return pick;
}
/* company → [{ key, court }] (a court shared by two rows is "A / B": each gets it) */
function placesOf(plan) {
  var out = {};
  plan.sessions.forEach(function (s) { s.courts.forEach(function (c) { if (!c.company) return; String(c.company).split(' / ').forEach(function (name) { (out[name] = out[name] || []).push({ key: s.key, court: c.court }); }); }); });
  return out;
}
function theirs(company, name) { return String(company).split(' / ').indexOf(name) >= 0; }

/* The hall, as GP Sports drew it (1 Oct 2026): walk in through the door — the LEFT side has 4 courts, the RIGHT side 8. The courts run away
   from the door in pairs, numbered left to right: the odd number is at the far end, the even number nearest the door. If the real hall
   differs, this is the one place to change (then rebuild: tests/web.test.js checks every court has exactly one seat). */
var HALL = { left: [[1, 2], [3, 4]], right: [[5, 6], [7, 8], [9, 10], [11, 12]] };
/* where court n is: which side, which pair along the hall (0 = leftmost), and whether it is the far end */
function seat(n) {
  var sides = ['left', 'right'], before = 0;
  for (var s = 0; s < 2; s++) {
    var pairs = HALL[sides[s]];
    for (var p = 0; p < pairs.length; p++) for (var e = 0; e < 2; e++) if (pairs[p][e] === n) return { side: sides[s], pair: before + p, far: e === 0 };
    before += pairs.length;
  }
  return null;
}
function where(n) { var s = seat(n); return s ? s.side + ' side, ' + (s.far ? 'far end' : 'near the door') : ''; }
/* the grid cell (1-based) of court n in the two drawings: 'wide' = as you walk in (door at the bottom), 'narrow' = turned on its side (door on the left).
   The aisle between the two sides takes one column (wide) or one row (narrow). */
function cell(n, mode) {
  var s = seat(n); if (!s) return null;
  var aisle = s.pair >= HALL.left.length ? 1 : 0;
  return mode === 'wide' ? { col: s.pair + 1 + aisle, row: s.far ? 2 : 3 } : { col: s.far ? 3 : 2, row: s.pair + 2 + aisle };
}
/* PURE:END */

(function () {
  var S = { plan: null, tab: '', pick: '', err: '', refocus: '' };
  var NS = 'http://www.w3.org/2000/svg';
  function $(id) { return document.getElementById(id); }
  function now() { try { return penang(new Date()); } catch (e) { return { date: '', hour: 0 }; } }   // an old browser without time zones just opens on "Whole evening"
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function sv(tag, attrs) { var e = document.createElementNS(NS, tag); Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); }); return e; }

  /* A badminton court from above, 6.1 × 13.4 m drawn in tenths of a metre, its long axis pointing away from the door (`sideways` turns it for the phone drawing). */
  function courtSvg(sideways) {
    function pt(x, y) { return sideways ? y + ' ' + x : x + ' ' + y; }
    function ln(x1, y1, x2, y2) { return 'M' + pt(x1, y1) + 'L' + pt(x2, y2); }
    var d = [ln(1, 1, 60, 1), ln(60, 1, 60, 133), ln(60, 133, 1, 133), ln(1, 133, 1, 1),   // the outer lines
      ln(5.6, 1, 5.6, 133), ln(55.4, 1, 55.4, 133),                                         // singles side lines
      ln(1, 8.6, 60, 8.6), ln(1, 125.4, 60, 125.4),                                         // doubles long service lines
      ln(1, 47.2, 60, 47.2), ln(1, 86.8, 60, 86.8),                                         // short service lines
      ln(30.5, 1, 30.5, 47.2), ln(30.5, 86.8, 30.5, 133)].join('');                         // centre lines
    var svg = sv('svg', { 'class': 'lines ' + (sideways ? 'h' : 'v'), viewBox: sideways ? '0 0 134 61' : '0 0 61 134', preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    svg.appendChild(sv('path', { d: d, 'class': 'ln' }));
    svg.appendChild(sv('path', { d: ln(1, 67, 60, 67), 'class': 'net' }));
    return svg;
  }

  function load() {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 30000);
    return fetch(API_URL + '?action=plan&_=' + Date.now(), { signal: ctl.signal })
      .then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (p) {
        if (!p || !p.ok || !p.sessions) throw new Error('bad reply');
        S.plan = p; S.err = '';
        if (!S.tab) S.tab = firstTab(p.sessions.map(function (s) { return s.key; }), EVENT_DATE, now());
        draw();
      }, function () { clearTimeout(timer); S.err = 'down'; draw(); });
  }

  function drawHall(s, live) {
    var hall = el('div', 'hall'), found = false;
    hall.setAttribute('role', 'group'); hall.setAttribute('aria-label', 'Hall floor plan, ' + label(s.key));
    hall.appendChild(el('p', 'side sl', 'Left side · ' + HALL.left.length * 2 + ' courts'));
    hall.appendChild(el('p', 'side sr', 'Right side · ' + HALL.right.length * 2 + ' courts'));
    s.courts.forEach(function (c) {
      var w = cell(c.court, 'wide'), n = cell(c.court, 'narrow'); if (!w) return;
      var mine = !!(c.company && S.pick && theirs(c.company, S.pick)); found = found || mine;
      var d = el('div', 'court ' + (c.company ? 'booked' : 'free') + (mine ? ' mine' : ''));
      d.style.setProperty('--wc', w.col); d.style.setProperty('--wr', w.row); d.style.setProperty('--nc', n.col); d.style.setProperty('--nr', n.row);
      var say = 'Court ' + c.court + ', ' + where(c.court) + ': ' + (c.company || 'free');
      d.setAttribute('role', 'img'); d.setAttribute('aria-label', say); d.title = say;
      d.appendChild(courtSvg(true)); d.appendChild(courtSvg(false));
      d.appendChild(el('span', 'no', String(c.court)));
      d.appendChild(el('span', 'co', c.company || 'Free'));
      hall.appendChild(d);
    });
    hall.appendChild(el('div', 'door', 'Door'));
    if (found) hall.className += ' picked';
    var box = document.createDocumentFragment(); box.appendChild(hall);
    var lg = el('p', 'legend'); lg.appendChild(document.createElement('span')).appendChild(el('i', 'b')); lg.lastChild.appendChild(document.createTextNode('Company on this court'));
    var fr = lg.appendChild(document.createElement('span')); fr.appendChild(el('i', 'f')); fr.appendChild(document.createTextNode('Free'));
    if (S.pick) { var my = lg.appendChild(document.createElement('span')); my.appendChild(el('i', 'm')); my.appendChild(document.createTextNode(S.pick)); }
    box.appendChild(lg);
    if (S.pick && !found) box.appendChild(el('p', 'away', S.pick + ' isn’t on a court in this session — see the other sessions above.'));
    box.appendChild(el('p', 'turn', 'Turned on its side so names fit your phone: you walk in at the door on the left — the LEFT side of the hall is the top block, the RIGHT side the bottom one. Not to scale.'));
    return box;
  }

  function draw() {
    var p = S.plan, view = $('view');
    $('banner').hidden = !(p && S.err);
    if (p && S.err) $('banner').textContent = 'Couldn’t refresh just now — showing the last update (' + p.updated.slice(11, 16) + ').';
    if (!p) {
      if (!S.err) return;
      view.textContent = ''; var e = el('div', 'err', 'Couldn’t load the floor plan. Check your connection and try again.'), b = el('button', null, 'Try again'); b.type = 'button'; b.onclick = function () { view.textContent = ''; view.appendChild(el('p', 'sub', 'Loading the floor plan…')); load(); }; e.appendChild(document.createElement('br')); e.appendChild(b); view.appendChild(e); return;
    }
    $('event').textContent = p.event || '';
    $('when').textContent = p.when || ''; $('when').hidden = !p.when;
    $('venue').textContent = p.where || ''; $('venue').hidden = !p.where;
    var places = placesOf(p), names = Object.keys(places).sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; });
    // the company picker: only companies that have a court, kept across refreshes
    var sel = $('company'), have = [].map.call(sel.options, function (o) { return o.value; }).join('|');
    if (have !== [''].concat(names).join('|')) {
      sel.textContent = ''; var o0 = el('option', null, 'Choose your company…'); o0.value = ''; sel.appendChild(o0);
      names.forEach(function (n) { var o = el('option', null, n); o.value = n; sel.appendChild(o); });
    }
    if (S.pick && names.indexOf(S.pick) < 0) S.pick = '';
    sel.value = S.pick; $('find').hidden = false; sel.onchange = function () { S.pick = sel.value; try { localStorage.setItem('ct-plan-company', S.pick); } catch (e) {} draw(); };
    var m = $('mine'); m.textContent = ''; m.hidden = !S.pick; m.className = 'mine';
    if (S.pick) {
      var mine = places[S.pick].slice().sort(function (a, b) { return startHour(a.key) - startHour(b.key); }), seen = {}, spots = [];
      mine.forEach(function (x, i) { m.appendChild(document.createTextNode((i ? '  ·  ' : S.pick + ': ') + label(x.key) + ', Court ' + x.court)); if (!seen[x.court]) { seen[x.court] = 1; spots.push('Court ' + x.court + ' is on the ' + where(x.court)); } });
      m.appendChild(el('small', null, spots.join(' · ')));
    }
    // sessions
    var keys = p.sessions.map(function (s) { return s.key; }), live = liveKey(keys, EVENT_DATE, now()), tabs = $('tabs'); tabs.textContent = ''; tabs.hidden = false;
    keys.concat(['all']).forEach(function (k) {
      var b = el('button', 'tab', k === 'all' ? 'Whole evening' : label(k)); b.type = 'button'; b.setAttribute('aria-pressed', k === S.tab ? 'true' : 'false');
      if (k === live) b.appendChild(el('span', 'now', 'now'));
      b.onclick = function () { S.tab = k; S.refocus = k; draw(); }; tabs.appendChild(b);
      if (S.refocus === k) { S.refocus = ''; b.focus(); }   // the pills are rebuilt on every draw — keep a keyboard user's place
    });
    view.textContent = '';
    if (S.tab === 'all') {
      $('sub').hidden = false; $('sub').textContent = 'Every court, every session. Your company is highlighted once you choose it above.';
      var wrap = el('div', 'tablewrap'), t = el('table'), hr = el('tr'); hr.appendChild(el('th', null, 'Court'));
      keys.forEach(function (k) { hr.appendChild(el('th', k === live ? 'live' : null, label(k))); });
      var th = el('thead'); th.appendChild(hr); t.appendChild(th); var tb = el('tbody');
      for (var c = 1; c <= p.courts; c++) {
        var tr = el('tr'); tr.appendChild(el('td', 'cno', String(c)));
        p.sessions.forEach(function (s) {
          var co = s.courts[c - 1].company, td = el('td', co ? (S.pick && theirs(co, S.pick) ? 'mine-cell' : '') : 'free', co || '–');
          if (s.key === live && !td.className) td.className = 'live'; tr.appendChild(td);
        }); tb.appendChild(tr);
      }
      t.appendChild(tb); wrap.appendChild(t); view.appendChild(wrap);
    } else {
      var s = p.sessions.filter(function (x) { return x.key === S.tab; })[0] || p.sessions[0], taken = s.courts.filter(function (x) { return x.company; }).length;
      $('sub').hidden = false; $('sub').textContent = label(s.key) + ' · ' + taken + ' of ' + p.courts + ' courts have a company' + (s.key === live ? ' · happening now' : '');
      view.appendChild(drawHall(s, live));
    }
    var f = $('foot'); f.hidden = false; f.textContent = 'Updated ' + p.updated.slice(11, 16) + ' · this page updates by itself · ';
    var a = el('a', null, 'Book or change your slot'); a.href = 'index.html'; f.appendChild(a);
  }

  try { S.pick = localStorage.getItem('ct-plan-company') || ''; } catch (e) {}
  load();
  setInterval(function () { if (document.visibilityState === 'visible') load(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.plan) load(); });
})();
</script>
