<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P.LAB CUP 2026 – Court Testing Floor Plan</title>
<meta name="description" content="Which company is on which court, and when — 12 courts, every session. Thursday 1 October 2026 · Arena Sukan USM Azman Hashim, 20 Jalan Stadium, Gelugor, Pulau Pinang.">

<meta property="og:type" content="website">
<meta property="og:title" content="P.LAB CUP 2026 – Court Testing Floor Plan">
<meta property="og:description" content="Which company is on which court, and when — 12 courts, every session. Thursday 1 October 2026 · Arena Sukan USM Azman Hashim, 20 Jalan Stadium, Gelugor, Pulau Pinang.">
<meta name="theme-color" content="#0c7a52">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c7a52'/%3E%3Cg fill='none' stroke='white' stroke-width='3'%3E%3Crect x='12' y='18' width='40' height='28'/%3E%3Cpath d='M32 18v28M12 32h40'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
  --bg: #f3f6f4; --card: #ffffff; --ink: #14201b; --muted: #5a6a62; --line: #d8e2dc;
  --brand: #0c7a52; --brand-ink: #ffffff; --brand-soft: #e4f3ec; --accent: #f2c230;
  --danger: #b3261e; --danger-soft: #fbe9e7; --live: #c2410c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1613; --card: #17211d; --ink: #e9f1ed; --muted: #94a69d; --line: #2a3832;
    --brand: #34c48e; --brand-ink: #062419; --brand-soft: #12342a;
    --danger: #ff8a80; --danger-soft: #3a1c19; --live: #ffb067;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
[hidden] { display: none !important; }

.hero { position: relative; overflow: hidden; border-radius: 18px; padding: 22px 20px 20px; background: linear-gradient(160deg, #0a5e40, #0c7a52 70%); color: #fff; }
.hero .court { position: absolute; right: -14px; top: -6px; width: 190px; color: #fff; opacity: .16; }
.eyebrow { position: relative; margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { position: relative; margin: 0 0 8px; font-size: 26px; line-height: 1.15; }
.hero p { position: relative; margin: 0; font-size: 15px; opacity: .92; }
.hero .when { margin-top: 12px; font-weight: 700; font-size: 16px; opacity: 1; }
.hero .venue { margin-top: 2px; }
.hero a { color: #fff; font-weight: 700; }

.panel { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 16px 14px; }
label.lbl { display: block; margin: 0 0 6px; font-size: 14px; font-weight: 600; }
select { width: 100%; height: 48px; padding: 0 14px; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; }
select:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--brand); }
.mine { margin: 10px 0 0; padding: 11px 13px; border-radius: 12px; background: var(--brand-soft); font-size: 15px; font-weight: 600; }
.mine.none { background: var(--danger-soft); color: var(--danger); }
.note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.note a { color: var(--brand); font-weight: 600; }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
.tab { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.tab[aria-pressed=true] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tab .now { margin-left: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--live); }
.tab[aria-pressed=true] .now { color: var(--brand-ink); }

.sub { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0 0; padding: 0; list-style: none; }
@media (min-width: 480px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(4, 1fr); } }
.tile { min-height: 88px; padding: 10px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.tile .no { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tile .co { font-size: 16px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.tile.free { background: transparent; border-style: dashed; }
.tile.free .co { font-weight: 500; color: var(--muted); }
.tile.mine-tile { background: var(--brand-soft); border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand) inset; }

.tablewrap { margin-top: 12px; overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
th { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
td.cno { font-weight: 800; color: var(--muted); white-space: nowrap; }
td.free { color: var(--muted); }
th.live, td.live { background: rgba(242, 194, 48, .2); }
td.mine-cell { background: var(--brand-soft); font-weight: 700; box-shadow: 0 0 0 2px var(--brand) inset; }
tr:last-child td { border-bottom: 0; }

.foot { margin: 18px 2px 0; font-size: 13px; color: var(--muted); }
.foot a { color: var(--brand); font-weight: 600; }
.banner { margin: 14px 0 0; padding: 10px 13px; border-radius: 12px; background: var(--danger-soft); color: var(--danger); font-size: 14px; font-weight: 600; }
.err { margin-top: 16px; padding: 16px; border-radius: 14px; background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.err button { margin-top: 10px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 700; cursor: pointer; }
@media print { .tabs, #find, .foot { display: none; } .hero { background: none; color: #000; } }
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <svg class="court" viewBox="0 0 120 60" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="114" height="54"/><line x1="60" y1="3" x2="60" y2="57"/><line x1="3" y1="12" x2="117" y2="12"/><line x1="3" y1="48" x2="117" y2="48"/><line x1="24" y1="3" x2="24" y2="57"/><line x1="96" y1="3" x2="96" y2="57"/><line x1="24" y1="30" x2="96" y2="30"/></g></svg>
    <p class="eyebrow" id="event"></p>
    <h1>Court testing floor plan</h1>
    <p>Which company is on which court, and when.</p>
    <p class="when" id="when" hidden></p>
    <p class="venue" id="venue" hidden></p>
  </header>

  <section class="panel" id="find" hidden>
    <label class="lbl" for="company">Find your company</label>
    <select id="company"></select>
    <p class="mine" id="mine" hidden></p>
    <p class="note">Not in the list? Your company hasn’t booked a court-testing slot yet — <a href="index.html">book one here</a>.</p>
  </section>

  <p class="banner" id="banner" role="status" hidden></p>
  <div class="tabs" id="tabs" role="group" aria-label="Choose a session" hidden></div>
  <p class="sub" id="sub" hidden></p>
  <div id="view" aria-live="polite"><p class="sub">Loading the floor plan…</p></div>
  <p class="foot" id="foot" hidden></p>
</main>
<noscript><p style="padding:20px">This page needs JavaScript. Please turn it on, or ask the GP Sports team.</p></noscript>
<script>
/* Standalone page: reads the live floor plan from the same server, over a cookie-less fetch(). */
var API_URL = "https://script.google.com/macros/s/AKfycbyg9-oAuzi4kcfH9AHfHt8Td7_75Ey7KCf8wOisxR8ONMaRf6l-bZYQmrpKd6UIOER1Lw/exec";
var EVENT_DATE = "2026-10-01";
/* PURE:START — no page access in here, so tests can run it on its own */
function startHour(key) { var m = /^(\d+)-(\d+)(am|pm)$/.exec(key); if (!m) return null; var h = +m[1]; if (m[3] === 'pm' && h < 12) h += 12; return h; }
function label(key) { var m = /^(\d+)-(\d+)(am|pm)$/.exec(key); return m ? m[1] + '–' + m[2] + ' ' + m[3] : key; }
/* Penang's clock: { date: '2026-10-01', hour: 19 } for any moment, wherever the phone is. */
function penang(d) {
  var p = {}; new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kuala_Lumpur', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hour12: false }).formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
  return { date: p.year + '-' + p.month + '-' + p.day, hour: +p.hour % 24 };
}
/* The session in progress on the event day ('' on any other day, or between sessions). */
function liveKey(keys, eventDate, now) {
  if (!eventDate || now.date !== eventDate) return '';
  for (var i = 0; i < keys.length; i++) { var h = startHour(keys[i]); if (h != null && now.hour >= h && now.hour < h + 1) return keys[i]; }
  return '';
}
/* Which tab to open first: the session in progress, else the next one, else the last; the whole evening on any other day. */
function firstTab(keys, eventDate, now) {
  if (!eventDate || now.date !== eventDate) return 'all';
  var pick = keys[keys.length - 1];
  for (var i = 0; i < keys.length; i++) { var h = startHour(keys[i]); if (h != null && now.hour < h + 1) { pick = keys[i]; break; } }
  return pick;
}
/* company → [{ key, court }] (a court shared by two rows is "A / B": each gets it) */
function placesOf(plan) {
  var out = {};
  plan.sessions.forEach(function (s) { s.courts.forEach(function (c) { if (!c.company) return; String(c.company).split(' / ').forEach(function (name) { (out[name] = out[name] || []).push({ key: s.key, court: c.court }); }); }); });
  return out;
}
function theirs(company, name) { return String(company).split(' / ').indexOf(name) >= 0; }
/* PURE:END */

(function () {
  var S = { plan: null, tab: '', pick: '', err: '', refocus: '' };
  function $(id) { return document.getElementById(id); }
  function now() { try { return penang(new Date()); } catch (e) { return { date: '', hour: 0 }; } }   // an old browser without time zones just opens on "Whole evening"
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function load() {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 30000);
    return fetch(API_URL + '?action=plan&_=' + Date.now(), { signal: ctl.signal })
      .then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (p) {
        if (!p || !p.ok || !p.sessions) throw new Error('bad reply');
        S.plan = p; S.err = '';
        if (!S.tab) S.tab = firstTab(p.sessions.map(function (s) { return s.key; }), EVENT_DATE, now());
        draw();
      }, function () { clearTimeout(timer); S.err = 'down'; draw(); });
  }

  function draw() {
    var p = S.plan, view = $('view');
    $('banner').hidden = !(p && S.err);
    if (p && S.err) $('banner').textContent = 'Couldn’t refresh just now — showing the last update (' + p.updated.slice(11, 16) + ').';
    if (!p) {
      if (!S.err) return;
      view.textContent = ''; var e = el('div', 'err', 'Couldn’t load the floor plan. Check your connection and try again.'), b = el('button', null, 'Try again'); b.type = 'button'; b.onclick = function () { view.textContent = ''; view.appendChild(el('p', 'sub', 'Loading the floor plan…')); load(); }; e.appendChild(document.createElement('br')); e.appendChild(b); view.appendChild(e); return;
    }
    $('event').textContent = p.event || '';
    $('when').textContent = p.when || ''; $('when').hidden = !p.when;
    $('venue').textContent = p.where || ''; $('venue').hidden = !p.where;
    var places = placesOf(p), names = Object.keys(places).sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; });
    // the company picker: only companies that have a court, kept across refreshes
    var sel = $('company'), have = [].map.call(sel.options, function (o) { return o.value; }).join('|');
    if (have !== [''].concat(names).join('|')) {
      sel.textContent = ''; var o0 = el('option', null, 'Choose your company…'); o0.value = ''; sel.appendChild(o0);
      names.forEach(function (n) { var o = el('option', null, n); o.value = n; sel.appendChild(o); });
    }
    if (S.pick && names.indexOf(S.pick) < 0) S.pick = '';
    sel.value = S.pick; $('find').hidden = false; sel.onchange = function () { S.pick = sel.value; try { localStorage.setItem('ct-plan-company', S.pick); } catch (e) {} draw(); };
    var m = $('mine'); m.textContent = ''; m.hidden = !S.pick; m.className = 'mine';
    if (S.pick) {
      places[S.pick].slice().sort(function (a, b) { return startHour(a.key) - startHour(b.key); }).forEach(function (x, i) { m.appendChild(document.createTextNode((i ? '  ·  ' : S.pick + ': ') + label(x.key) + ', Court ' + x.court)); });
    }
    // tabs
    var keys = p.sessions.map(function (s) { return s.key; }), live = liveKey(keys, EVENT_DATE, now()), tabs = $('tabs'); tabs.textContent = ''; tabs.hidden = false;
    keys.concat(['all']).forEach(function (k) {
      var b = el('button', 'tab', k === 'all' ? 'Whole evening' : label(k)); b.type = 'button'; b.setAttribute('aria-pressed', k === S.tab ? 'true' : 'false');
      if (k === live) b.appendChild(el('span', 'now', 'now'));
      b.onclick = function () { S.tab = k; S.refocus = k; draw(); }; tabs.appendChild(b);
      if (S.refocus === k) { S.refocus = ''; b.focus(); }   // the pills are rebuilt on every draw — keep a keyboard user's place
    });
    view.textContent = '';
    if (S.tab === 'all') {
      $('sub').hidden = false; $('sub').textContent = 'Every court, every session. Your company is highlighted once you choose it above.';
      var wrap = el('div', 'tablewrap'), t = el('table'), hr = el('tr'); hr.appendChild(el('th', null, 'Court'));
      keys.forEach(function (k) { hr.appendChild(el('th', k === live ? 'live' : null, label(k))); });
      var th = el('thead'); th.appendChild(hr); t.appendChild(th); var tb = el('tbody');
      for (var c = 1; c <= p.courts; c++) {
        var tr = el('tr'); tr.appendChild(el('td', 'cno', String(c)));
        p.sessions.forEach(function (s) {
          var co = s.courts[c - 1].company, td = el('td', co ? (S.pick && theirs(co, S.pick) ? 'mine-cell' : '') : 'free', co || '–');
          if (s.key === live && !td.className) td.className = 'live'; tr.appendChild(td);
        }); tb.appendChild(tr);
      }
      t.appendChild(tb); wrap.appendChild(t); view.appendChild(wrap);
    } else {
      var s = p.sessions.filter(function (x) { return x.key === S.tab; })[0] || p.sessions[0], taken = s.courts.filter(function (x) { return x.company; }).length;
      $('sub').hidden = false; $('sub').textContent = label(s.key) + ' · ' + taken + ' of ' + p.courts + ' courts have a company' + (s.key === live ? ' · happening now' : '');
      var ul = el('ul', 'grid');
      s.courts.forEach(function (c) {
        var li = el('li', 'tile' + (c.company ? (S.pick && theirs(c.company, S.pick) ? ' mine-tile' : '') : ' free'));
        li.appendChild(el('span', 'no', 'Court ' + c.court)); li.appendChild(el('span', 'co', c.company || 'Free')); ul.appendChild(li);
      });
      view.appendChild(ul);
    }
    var f = $('foot'); f.hidden = false; f.textContent = 'Updated ' + p.updated.slice(11, 16) + ' · this page updates by itself · ';
    var a = el('a', null, 'Book or change your slot'); a.href = 'index.html'; f.appendChild(a);
  }

  try { S.pick = localStorage.getItem('ct-plan-company') || ''; } catch (e) {}
  load();
  setInterval(function () { if (document.visibilityState === 'visible') load(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.plan) load(); });
})();
</script>
</body>
</html>
